<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thunderstore Archive</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">

    <!-- sidebar -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <rect width="24" height="24" rx="5" fill="#388bfd" opacity=".18"/>
          <path d="M6 7h12M6 12h8M6 17h6" stroke="#388bfd" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h1>Thunderstore Archive</h1>
        <button class="btn-new" id="btn-new">+ New</button>
      </div>
      <div id="job-list" class="job-list"></div>
    </aside>

    <!-- detail -->
    <main id="detail" class="detail">
      <div class="empty-state">
        <h2>No job selected</h2>
        <p>Create a new job or select one from the list.</p>
      </div>
    </main>

  </div>
  <script src="/static/app.js"></script>
</body>
</html>
